<!DOCTYPE html>
<html>
<head>
  <title>Gastenboek - De Tent</title>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .big-title {
      font-size: 60px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    textarea {
      width: 300px;
      height: 80px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      resize: none;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #28a745;
      color: white;
    }

    .message {
      background: #222;
      padding: 12px;
      margin: 10px auto;
      width: 60%;
      border-radius: 10px;
      text-align: left;
      word-wrap: break-word;
    }
  </style>
</head>

<body>

<div class="big-title">Bemoei je met je eigen tent!</div>

<h1>📖 Gastenboek</h1>

<textarea id="text" placeholder="Schrijf iets..."></textarea><br>
<button onclick="send()">Plaatsen</button>

<div id="messages"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "VUL_HIER_IN",
    authDomain: "onzetent-237c7.firebaseapp.com",
    databaseURL: "https://onzetent-237c7-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "onzetent-237c7"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const ref = db.ref("gastenboek");

  // 📤 bericht plaatsen
  function send() {
    const text = document.getElementById("text").value;

    if (!text) return;

    ref.push({
      text: text,
      time: Date.now()
    });

    document.getElementById("text").value = "";
  }

  // 🔄 live ophalen
  ref.on("value", (snapshot) => {
    const data = snapshot.val() || {};
    const container = document.getElementById("messages");

    container.innerHTML = "";

    Object.values(data)
      .sort((a, b) => b.time - a.time)
      .forEach(msg => {
        const div = document.createElement("div");
        div.className = "message";
        div.innerText = msg.text;
        container.appendChild(div);
      });
  });
</script>

</body>
</html>
